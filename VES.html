<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Contact Hub — 2025</title>
<style>
:root {
  --primary: #4f46e5; 
  --bg: #111827; 
  --card: #1f2937; 
  --text-main: #f9fafb; 
  --text-muted: #9ca3af;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  font-family: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
:root.light {
  --primary: #4f46e5;
  --bg: #f3f4f6;
  --card: #ffffff;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  color-scheme: light;
}

body {
  margin:0;
  min-height:100vh;
  background-color: var(--bg);
  background-image: radial-gradient(var(--text-muted) 1px, transparent 0);
  background-size: 40px 40px;
  background-attachment: fixed;
  color: var(--text-main);
  display:flex;
  flex-direction: column; 
  align-items:center;
  justify-content:center;
  padding:2rem 0;
  transition: background-color 0.5s, color 0.5s;
}

.system-bar {
  width:100%;
  max-width:960px;
  padding: 10px 40px;
  display:flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  background: var(--card);
  border-radius: 12px 12px 0 0;
  border: 1px solid rgba(255,255,255,0.08);
  border-bottom: none;
  box-shadow: var(--shadow);
  color: var(--text-muted);
}
.system-bar a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 0 8px;
    transition: color 0.3s;
}
.system-bar a:hover {
    color: var(--primary);
}
.contact-info-bar {
    margin-top: 20px;
    width: 100%;
    max-width: 960px;
    padding: 20px 40px;
    background: var(--card);
    border-radius: 0 0 12px 12px;
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
}
.contact-info-bar span {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
}
.contact-info-bar a {
    color: var(--primary);
    text-decoration: none;
}
@media (max-width: 768px) {
    .system-bar, .contact-info-bar {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 20px;
    }
    .system-bar-links, .system-bar-chat {
        display: flex;
        flex-wrap: wrap;
        margin-top: 5px;
        margin-bottom: 5px;
    }
    .contact-info-bar span {
        margin-bottom: 5px;
    }
}
.light .system-bar, .light .contact-info-bar {
    border-color: rgba(0, 0, 0, 0.08);
}

.container {
  width:100%;
  max-width:960px; 
  background:var(--card);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:0; 
  box-shadow:var(--shadow);
  padding:40px; 
  animation: fadeIn 0.6s ease;
}
.light .container {
  border-color: rgba(0, 0, 0, 0.08);
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:32px;
}
header h1 {
  display: flex;
  align-items: center;
  font-size:1.8rem;
  margin:0;
  font-weight:700; 
  color:var(--primary);
  gap: 10px;
}
header img {
  width: 50px;
  height: 50px;
  border-radius: 8px;
  object-fit: cover;
}

.mode-toggle {
  cursor:pointer;
  border:1px solid var(--text-muted);
  background:var(--bg);
  padding:8px 12px;
  border-radius:8px;
  color:var(--text-muted);
  font-size:1.1rem;
  transition: .3s, color .3s;
}
.mode-toggle:hover {background:rgba(156,163,175,0.1); border-color: var(--primary);}
.light .mode-toggle {background:var(--card); border-color: #d1d5db;}
.light .mode-toggle:hover {background:rgba(0,0,0,0.05);}

form {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px; 
}
#msg, button.submit {
  grid-column: 1 / -1; 
}

input, textarea {
  background:var(--bg);
  border:1px solid var(--text-muted);
  border-radius:8px;
  color:var(--text-main);
  padding:12px 16px;
  font-size:1rem;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.light input, .light textarea {
  background:#f9fafb;
  border-color: #d1d5db;
}
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4);
}
textarea {min-height:120px;resize:vertical;}

button.submit {
  background:var(--primary);
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:600;
  padding:12px 24px;
  cursor:pointer;
  transition: opacity 0.2s, transform 0.2s;
}
button.submit:hover {
  opacity:0.9;
  transform: translateY(-1px);
}
button.submit:disabled {
  opacity:0.6;
  cursor:not-allowed;
}

.notice {
  display:none;
  margin-top:20px;
  padding:14px;
  border-radius:8px;
  font-size:1rem;
}
.notice.show {display:block;}
.notice.success {background:rgba(16,185,129,0.1);border:1px solid var(--success);color:var(--success);}
.notice.error {background:rgba(239,68,68,0.1);border:1px solid var(--danger);color:var(--danger);}

.messages {
  margin-top:32px;
  border-top:1px solid rgba(156,163,175,0.2);
  padding-top:20px;
}
.message {
  background:var(--bg);
  border-radius:8px;
  padding:14px 18px;
  margin-bottom:12px;
  border-left: 4px solid var(--primary);
  transition:  0.3s, box-shadow 0.3s;
}
.light .message {background:#f9fafb;}
.message:hover {
  background: rgba(79, 70, 229, 0.05); 
}
.message-content {
  margin:6px 0;
  white-space: pre-wrap; 
}
.message-meta {
  font-size:0.8rem;
  color:var(--text-muted);
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.message-meta button {
  background:none;
  border:none;
  color:var(--danger);
  font-size:0.8rem;
  cursor:pointer;
  transition: color 0.3s;
}
.message-meta button:hover {color:#dc2626;}

@media (max-width:768px){
  .container {padding: 20px;}
  form {grid-template-columns: 1fr;}
  header h1 {font-size: 1.5rem;}
  .system-bar, .contact-info-bar {
      padding: 10px 20px;
  }
}
</style>
</head>
<body class="dark">

<div class="system-bar">
    <div class="system-bar-links">
        <a href="#camera">📷 Camera</a>
        <a href="#calendar">📅 Calendar</a>
        <a href="#settings">⚙️ Settings (Ubuntu)</a>
    </div>
    <div class="system-bar-chat">
        <a href="#chat">💬 Join Chat</a>
    </div>
</div>

<div class="container">
  <header>
    <h1> 
        <img src="b.jpeg" width="50px" height="50px" alt="Aurora Logo">
        ✉️ Aurora Contact Hub
    </h1>
    <button class="mode-toggle" id="modeToggle">☀️</button>
  </header>
  <form id="contactForm">
    <input id="name" placeholder="Your Name" required>
    <input id="email" type="email" placeholder="you@example.com" required>
    <textarea id="msg" placeholder="Your message..." required></textarea>
    <button class="submit" type="submit" id="submitBtn">Send Message</button>
  </form>
  <div class="notice success" id="okNotice">✅ Message sent!</div>
  <div class="notice error" id="errNotice">❌ Please fill all fields.</div>

  <div class="messages" id="messageList"></div>
</div>

<div class="contact-info-bar">
    <span>📍 **Location:** Kigali, RWANDA</span>
    <span>
        📞 **Mobile:** <a href="tel:+250739390715">+250 739 390 715</a>
    </span>
    <span>
        📧 **Email:** <a href="mailto:salimabdu759@gmail.com">salimabdu759@gmail.com</a>
    </span>
</div>

<script>
const ContactApp = {
    form: document.getElementById('contactForm'),
    submitBtn: document.getElementById('submitBtn'),
    okNotice: document.getElementById('okNotice'),
    errNotice: document.getElementById('errNotice'),
    list: document.getElementById('messageList'),
    modeToggle: document.getElementById('modeToggle'),

    init() {
        this.render();
        this.form.onsubmit = (e) => this.handleSubmit(e);
        this.modeToggle.onclick = () => this.toggleTheme();
        this.initTheme();
    },

    loadMessages() {
        try {
            return JSON.parse(localStorage.getItem('aurora.msgs.v2')) || [];
        } catch {
            return [];
        }
    },

    saveMessages(data) {
        localStorage.setItem('aurora.msgs.v2', JSON.stringify(data));
    },

    deleteMessage(id) {
        const updated = this.loadMessages().filter(x => x.id !== id);
        this.saveMessages(updated);
        this.render();
    },

    render() {
        const msgs = this.loadMessages();
        this.list.innerHTML = msgs.length ? '' : '<p class="text-muted" style="color:var(--text-muted)">No messages yet. Send one!</p>';
        
        const fragment = document.createDocumentFragment();

        msgs.slice().reverse().forEach(m => {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <strong>${m.name}</strong> <small>(${m.email})</small>
                <div class="message-content">${m.msg}</div>
                <div class="message-meta">
                    <span>${new Date(m.date).toLocaleString()}</span>
                    <button data-id="${m.id}" aria-label="Delete message">Delete</button>
                </div>`;
            
            div.querySelector('button').onclick = () => this.deleteMessage(m.id);
            fragment.appendChild(div);
        });

        this.list.appendChild(fragment);
    },
    handleSubmit(e) {
        e.preventDefault();
        this.submitBtn.disabled = true;

        const name = this.form.name.value.trim();
        const email = this.form.email.value.trim();
        const msg = this.form.msg.value.trim();

        if (!name || !email || !msg) {
            this.showNotice(this.errNotice);
            this.submitBtn.disabled = false;
            return;
        }

        setTimeout(() => {
            const data = this.loadMessages();
            data.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2),
                name,
                email,
                msg,
                date: new Date()
            });
            this.saveMessages(data);
            this.form.reset();
            this.showNotice(this.okNotice);
            this.render();
            this.submitBtn.disabled = false; 
        }, 500); 
    },

    showNotice(n) {
        [this.okNotice, this.errNotice].forEach(x => x.classList.remove('show'));
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    },

    initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(savedTheme);
        this.modeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    },

    toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        document.documentElement.classList.toggle('light');
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', newTheme);
        this.modeToggle.textContent = isDark ? '🌙' : '☀️';
    }
};

document.addEventListener('DOMContentLoaded', () => {
    ContactApp.init();
});

</script>
</body>
</html>
